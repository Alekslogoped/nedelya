<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4eddf"><title>Маша и семь разноцветных дней</title><meta name="description" content="Акварельный комикс о днях недели и игра «Собери неделю»."><style>
:root{font-family:'Trebuchet MS',Arial,sans-serif;color:#57432f;background:#f4eddf}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 30%,#fffdf7 0,#f5eedf 55%,#e9dfcb 100%)}button{font:inherit;color:inherit;cursor:pointer;border:0}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #8b7050;outline-offset:3px}header{display:flex;justify-content:space-between;align-items:center;max-width:1480px;margin:20px auto;padding:0 25px;gap:15px}.brand small{font-size:10px;letter-spacing:3px;color:#9d8466}.brand p{margin:6px 0;font-size:18px}.tools{display:flex;gap:8px}.tools button,.quiet{background:#fff9;border:1px solid #cbbda6;border-radius:30px;padding:10px 17px;font-size:13px}main{max-width:1540px;padding:0 24px;margin:auto}.stage{perspective:2500px;position:relative;filter:drop-shadow(0 15px 14px #614c3033);isolation:isolate}.book{display:grid;grid-template-columns:1fr 1fr;position:relative;border-radius:9px;background:#fffaf0;border:1px solid #cdbda2;overflow:hidden}.book.single{max-width:900px;margin:auto;display:block}.page{background:#fffaf0;position:relative;min-width:0;padding:12px 12px 24px;aspect-ratio:1.46;display:grid;align-items:center}.page:first-child:not(:last-child){border-right:1px solid #bba887}.page:last-child:not(:first-child){background:linear-gradient(90deg,#d7c8aa88,#fffaf0 5%)}.page:after{content:attr(data-page);position:absolute;bottom:5px;left:50%;font-size:10px;color:#9d8a70}.illustration{display:block;width:100%;height:100%;object-fit:contain;border-radius:4px;cursor:zoom-in}.spine{position:absolute;inset:0 auto 0 50%;width:20px;background:linear-gradient(90deg,transparent,#66523917,transparent);transform:translateX(-50%);pointer-events:none;z-index:2}.single .spine{display:none}.nav{display:flex;justify-content:center;align-items:center;gap:24px;margin:25px 0 13px}.nav button,.primary{background:#7b7657;color:#fffdf4;border-radius:30px;padding:12px 24px;box-shadow:0 3px #58553c}.nav button:disabled{opacity:.3;cursor:default}.counter{font-size:13px;min-width:120px;text-align:center;color:#947a59}.below{text-align:center;font-size:12px;color:#a28c70;margin:0 0 20px}.dots{display:flex;justify-content:center;gap:7px;margin:15px 0 20px}.dots button{width:9px;height:9px;padding:0;border-radius:50%;background:#d8ccb6}.dots button.on{background:#8c7658;transform:scale(1.25)}.leaf{position:absolute;top:0;height:100%;width:50%;right:0;transform-origin:left center;transform-style:preserve-3d;z-index:10;pointer-events:none;animation:turn .95s cubic-bezier(.35,.05,.3,1) forwards}.leaf.rev{left:0;right:auto;transform-origin:right center;animation-name:turnback}.leaf .front,.leaf .back{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background:#fffaf0;box-shadow:0 0 35px #6e553033}.leaf .back{transform:rotateY(180deg);background:linear-gradient(90deg,#f2e7d2,#fffaf0 20%)}.leaf:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#6d4e2c33,transparent 35%);pointer-events:none}.leaf .page{width:100%;height:100%;aspect-ratio:auto}.leaf .front img{pointer-events:none}@keyframes turn{to{transform:rotateY(-180deg)}}@keyframes turnback{to{transform:rotateY(180deg)}}.game{display:block;padding:22px 24px 24px;background:#fffaf0!important}.game h2{font-size:clamp(19px,2.2vw,30px);margin:0 0 6px}.game p{font-size:clamp(11px,1vw,14px);line-height:1.35;margin:0 0 10px;color:#8d765b}.playfield{display:grid;grid-template-columns:1fr 1fr;gap:16px}.column-title{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#a28b6b;margin-bottom:6px}.slots,.bank{display:grid;gap:5px;align-content:start;min-height:240px}.slot{display:flex;align-items:center;gap:7px;min-height:29px;border:1px dashed #c7b698;border-radius:8px;padding:2px 5px;background:#f8f2e6;cursor:pointer}.slot .number{font-size:10px;color:#a28b6b;width:14px;text-align:center;flex-shrink:0}.card{padding:6px 8px;border:2px solid transparent;border-radius:7px;background:var(--c);font-size:clamp(11px,1.1vw,15px);font-weight:bold;min-height:29px;touch-action:none;width:100%;user-select:none;color:#594b3c}.slot .card{padding:3px 5px;min-height:24px}.card.selected{border-color:#7e6140}.slot.good{background:#e7efdf;border-color:#87a46b}.slot.wrong{border-color:#c97d67;background:#fbede6}.feedback{font-size:clamp(11px,1.1vw,15px);margin:7px 0;min-height:19px;color:#7e7251}.game-footer{display:flex;justify-content:space-between;align-items:center;gap:8px}.game-footer button{font-size:12px;padding:8px 13px}.flying{position:fixed!important;width:170px;z-index:999;pointer-events:none;box-shadow:0 7px 20px #59401b44;transform:rotate(-3deg)}dialog{border:0;background:#fffaf0;padding:12px;border-radius:12px;max-width:96vw;max-height:96svh;color:#6e5638;box-shadow:0 15px 50px #0004}dialog::backdrop{background:#342617bb}dialog img{max-width:90vw;max-height:83svh;object-fit:contain;display:block}dialog button{display:block;margin:8px auto 0;border-radius:20px;padding:8px 22px;background:#eee2cb}.gallery{max-width:1300px;margin:30px auto;padding:0 25px}.gallery-head{display:flex;justify-content:space-between;align-items:center}.gallery h2{font-size:25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.thumb{background:#fffaf0;padding:8px;border-radius:10px;box-shadow:0 5px 12px #59401b13;text-align:left}.thumb img{width:100%;aspect-ratio:1.5;object-fit:contain;border-radius:5px}.thumb span{display:block;font-size:12px;margin:7px 5px;color:#8e7658}[hidden]{display:none!important}.mobile-only{display:none}.loading{background:#fff7e8;text-align:center;font-size:14px;padding:10px;border-radius:20px;margin:15px auto;max-width:500px}.book.single .page{aspect-ratio:1.48}.back-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px} @media(min-width:1500px){.game{padding:30px}.slot,.card{min-height:36px}.slots,.bank{gap:8px}.feedback{margin:12px 0}}@media(max-width:900px){header{margin:13px auto;padding:0 15px}.brand p{font-size:14px}.brand small{font-size:8px;letter-spacing:2px}.tools button{padding:9px 12px;font-size:11px}main{padding:0 12px}.book{display:block;max-width:780px;margin:auto}.page{aspect-ratio:1.46}.page:first-child:not(:last-child){border:0}.spine{display:none}.leaf{width:100%}.game{padding:22px 24px}.game h2{font-size:25px}.game p{font-size:13px}.card{font-size:14px}.slot,.card{min-height:33px}.slots,.bank{min-height:265px}.feedback{font-size:13px}.counter{min-width:100px}.nav{gap:14px;margin:20px 0 12px}.nav button{padding:11px 20px}.grid{grid-template-columns:1fr 1fr}.mobile-only{display:initial}}@media(max-width:500px){.brand small{display:none}.brand p{max-width:150px;font-size:13px}.tools{gap:5px}.tools button{padding:8px 10px;font-size:10px}.game{aspect-ratio:auto!important;padding:18px 16px 27px;min-height:460px}.game h2{font-size:22px}.playfield{gap:10px}.card{font-size:12px}.game p{font-size:12px}.slot,.card{min-height:33px}.slots,.bank{min-height:264px}.game-footer button{font-size:11px}.page{padding:7px 7px 20px}.gallery{padding:0 12px}.grid{gap:10px}.thumb span{font-size:10px}.below{font-size:10px}.game-footer{gap:5px}.nav button{padding:10px 16px}.counter{font-size:11px}.dots{gap:5px}.dots button{width:7px;height:7px}}@media(prefers-reduced-motion:reduce){.leaf{animation:none;display:none}}
</style></head><body><header><div class="brand"><small>АКВАРЕЛЬНЫЕ ИСТОРИИ</small><p>Маша и семь разноцветных дней</p></div><div class="tools"><button id="gallery-toggle">Все картинки</button><button id="game-link">Собрать неделю</button></div></header><main id="reader"><div class="stage" id="stage"><div class="book single" id="book"></div></div><nav class="nav" aria-label="Листать книгу"><button id="prev" aria-label="Предыдущая страница">← Назад</button><span class="counter" id="counter" aria-live="polite"></span><button id="next" aria-label="Следующая страница">Дальше →</button></nav><div class="dots" id="dots"></div><p class="below">Листай кнопками или тяни страницу за нижний угол. Нажми на рисунок, чтобы рассмотреть крупнее.</p><div class="back-actions" id="back-actions" hidden><button class="primary" id="restart">Читать сначала</button><button class="quiet" id="replay">Собрать неделю ещё раз</button></div></main><section class="gallery" id="gallery" hidden><div class="gallery-head"><h2>Иллюстрации к книге</h2><button class="quiet" id="close-gallery">Вернуться к книге</button></div><p>Каждая сцена — отдельная картинка. Нажми, чтобы рассмотреть.</p><div class="grid" id="grid"></div></section><dialog id="zoom"><img id="zoom-image" alt=""><button id="close-zoom">Закрыть ×</button></dialog><script>
'use strict';
const files=['00-cover','01-intro','02-helper','03-mon-start','04-mon-end','05-tue-start','06-tue-end','07-wed-start','08-wed-end','09-thu-start','10-thu-end','11-fri-start','12-fri-end','13-sat-start','14-sat-end','15-sun-start','16-sun-end',null,'18-end','19-back'];
const labels=['Обложка','Маша перепутала день','Волшебный помощник','Понедельник: начинаем','Понедельник: наш домик','Вторник: два окна','Вторник: окошко для котёнка','Среда: середина недели','Среда: украшаем домик','Четверг: четыре стула','Четверг: места для гостей','Пятница: пять флажков','Пятница: домик готов','Суббота: первый выходной','Суббота: семейный пикник','Воскресенье: отдых','Воскресенье: завтра понедельник','Игра «Собери неделю»','Маша запомнила дни','До новых встреч'];
const descriptions=['Маша и семь разноцветных дней. Комикс о днях недели.','Маша: Я готова к субботнему пикнику! Мама: Маша, сегодня понедельник!','Маша: Как же запомнить все дни? Карандаш: Построим домик! Каждый день — новое дело!','Понедельник — первый день. Начинаем!','Здесь будет наш домик! Котёнок: Мяу! Я тоже буду жить здесь!','Вторник — второй день. Нарисуем два окна!','Одно окошко, второе окошко! Котёнок: А это — моё!','Среда — середина рабочей недели!','Повешу картинку посередине! Мур-мур.','Четверг — четвёртый день. Поставим четыре стула!','Маме, папе, мне… А этот стул — тебе!','Пятница — пятый день. Сделаю пять флажков!','Домик готов! Завтра суббота!','Сегодня точно суббота? Мама: Да! Первый выходной!','Приглашаю всех на пикник! Мама: Какой уютный домик!','Воскресенье — второй выходной. Сегодня отдохнём!','Карандаш: А какой день будет завтра? Маша: Снова понедельник!','','Теперь я знаю все дни недели! А после воскресенья всё начинается снова!','До новых встреч! Каждая неделя — новое приключение.'];
const days=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];const colors=['#efc6b8','#efd3a2','#eee4ab','#cdddb8','#badad5','#c9cde6','#e0c6db'];
const $=s=>document.querySelector(s);const book=$('#book'),stage=$('#stage');let page=0,turning=false,mobile=matchMedia('(max-width:900px)').matches;let places=Array(7).fill(null),shuffle=[],selected=null,hints=true,suppressClick=false;
function visiblePages(){return mobile||page===0||page===19?[page]:[page,page+1]}
function imagePage(n){return `<section class="page" data-page="${n+1}" aria-label="Страница ${n+1}: ${labels[n]}"><img class="illustration" data-index="${n}" src="assets/${files[n]}.webp" alt="${descriptions[n]}" draggable="false" ${n>2?'loading="lazy"':''}></section>`}
function gamePage(){return `<section class="page game" data-page="18" aria-label="Игра на одной странице"><h2>Собери неделю</h2><p>Перетащи дни на свои места. Можно нажать на карточку, а затем на её место.</p><div class="playfield"><div><div class="column-title">Дни по порядку</div><div class="slots" id="slots"></div></div><div><div class="column-title">Карточки</div><div class="bank" id="bank" aria-label="Перемешанные карточки"></div></div></div><div class="feedback" id="feedback" aria-live="polite">Начни с понедельника.</div><div class="game-footer"><button class="primary" id="check">Проверить ✓</button><button class="quiet" id="reset">Заново</button><button class="quiet" id="hints">Без чисел</button></div></section>`}
function render(){let vis=visiblePages();book.classList.toggle('single',vis.length===1);book.innerHTML=vis.map(n=>n===17?gamePage():imagePage(n)).join('')+'<div class="spine"></div>';$('#counter').textContent=page===0?'Обложка · 1 / 20':vis.length===1?`Страница ${page+1} / 20`:`Страницы ${page+1}–${page+2} / 20`;$('#prev').disabled=page===0;$('#next').disabled=page===19;$('#back-actions').hidden=page!==19;$('#dots').innerHTML=Array.from({length:mobile?20:11},(_,i)=>{let p=mobile?i:i===0?0:i===10?19:2*i-1;return `<button class="${vis.includes(p)?'on':''}" data-page="${p}" aria-label="${labels[p]}" ${vis.includes(p)?'aria-current="page"':''}></button>`}).join('');book.querySelectorAll('.illustration').forEach(el=>el.onclick=()=>{if(!suppressClick)openImage(Number(el.dataset.index))});if(vis.includes(17)){if(!shuffle.length)resetGame();else drawGame()};preload(vis[vis.length-1]+1);}
function target(step){if(mobile)return Math.min(19,Math.max(0,page+step));if(step>0)return page===0?1:Math.min(19,page+2);return page===1?0:Math.max(0,page-2)}
function go(p){if(turning)return;p=Math.min(19,Math.max(0,p));if(!mobile&&p!==0&&p!==19&&p%2===0)p--;if(p===page)return;const forward=p>page,old=book.querySelectorAll('.page'),leaf=document.createElement('div');leaf.className='leaf'+(!forward?' rev':'');let oldPage=old[forward?old.length-1:0].cloneNode(true);oldPage.removeAttribute('aria-label');oldPage.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));oldPage.querySelectorAll('button').forEach(el=>el.tabIndex=-1);leaf.setAttribute('aria-hidden','true');leaf.innerHTML='<div class="front"></div><div class="back"></div>';leaf.querySelector('.front').appendChild(oldPage);let previousSingle=old.length===1;page=p;render();if(previousSingle&&mobile===false)leaf.style.width='50%';stage.appendChild(leaf);turning=true;setTimeout(()=>{leaf.remove();turning=false},960);}
function preload(n){for(let i=n;i<Math.min(n+3,20);i++)if(files[i]){const im=new Image();im.src='assets/'+files[i]+'.webp'}}
function openImage(i){$('#zoom-image').src='assets/'+files[i]+'.webp';$('#zoom-image').alt=descriptions[i];$('#zoom').showModal()}
$('#close-zoom').onclick=()=>$('#zoom').close();$('#zoom').onclick=e=>{if(e.target===$('#zoom'))$('#zoom').close()};$('#prev').onclick=()=>go(target(-1));$('#next').onclick=()=>go(target(1));$('#dots').onclick=e=>{const b=e.target.closest('[data-page]');if(b)go(Number(b.dataset.page))};$('#game-link').onclick=()=>{hideGallery();go(17)};$('#restart').onclick=()=>go(0);$('#replay').onclick=()=>{places.fill(null);shuffle=[];go(17)};
document.addEventListener('keydown',e=>{if($('#zoom').open||!$('#gallery').hidden)return;if(e.key==='ArrowRight')go(target(1));if(e.key==='ArrowLeft')go(target(-1))});matchMedia('(max-width:900px)').addEventListener('change',e=>{mobile=e.matches;if(!mobile&&page>0&&page<19&&page%2===0)page--;render()});
let start=null;stage.addEventListener('pointerdown',e=>{if(e.target.closest('button,.slot'))return;let b=stage.getBoundingClientRect();if(e.clientY<b.bottom-70)return;start={x:e.clientX,y:e.clientY}});stage.addEventListener('pointerup',e=>{if(!start)return;const dx=e.clientX-start.x;start=null;if(Math.abs(dx)>45){suppressClick=true;go(target(dx<0?1:-1));setTimeout(()=>suppressClick=false,250)}});stage.addEventListener('pointercancel',()=>start=null);
function card(d){return `<button type="button" class="card ${selected===d?'selected':''}" data-day="${d}" style="--c:${colors[d]}" aria-pressed="${selected===d}">${days[d]}</button>`}
function resetGame(){places=Array(7).fill(null);shuffle=[0,1,2,3,4,5,6];for(let i=6;i>0;i--){let j=Math.floor(Math.random()*(i+1));[shuffle[i],shuffle[j]]=[shuffle[j],shuffle[i]]}selected=null;drawGame()}
function drawGame(){if(!$('#slots'))return;$('#slots').innerHTML=places.map((d,i)=>`<div class="slot" data-slot="${i}" tabindex="0" aria-label="Место ${i+1}"><span class="number">${hints?i+1:'○'}</span>${d===null?'':card(d)}</div>`).join('');$('#bank').innerHTML=shuffle.filter(d=>!places.includes(d)).map(card).join('');$('#hints').textContent=hints?'Без чисел':'С числами';$('#feedback').textContent='Расставь дни и нажми «Проверить».';book.querySelectorAll('.card').forEach(el=>{el.onclick=e=>{e.stopPropagation();if(suppressClick)return;selected=Number(el.dataset.day);drawGame()};el.onpointerdown=e=>drag(e,Number(el.dataset.day))});book.querySelectorAll('.slot').forEach(el=>{const select=()=>{if(selected!==null)place(selected,Number(el.dataset.slot))};el.onclick=select;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}}});$('#check').onclick=check;$('#reset').onclick=resetGame;$('#hints').onclick=()=>{hints=!hints;drawGame()};}
function place(d,i){const from=places.indexOf(d),other=places[i];if(from>=0)places[from]=other;places[i]=d;selected=null;drawGame()}
function drag(e,d){if(e.button!==0)return;const x=e.clientX,y=e.clientY;let ghost=null;const move=ev=>{if(!ghost&&Math.hypot(ev.clientX-x,ev.clientY-y)>7){ghost=e.target.cloneNode(true);ghost.classList.add('flying');document.body.appendChild(ghost)}if(ghost){ghost.style.left=ev.clientX-75+'px';ghost.style.top=ev.clientY-17+'px';}};const clean=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',cancel)};const up=ev=>{clean();if(ghost){ghost.remove();suppressClick=true;const slot=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-slot]'),bank=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('#bank');if(slot)place(d,Number(slot.dataset.slot));else if(bank){const from=places.indexOf(d);if(from>=0)places[from]=null;drawGame()}setTimeout(()=>suppressClick=false,200)}};const cancel=()=>{ghost?.remove();clean()};document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',cancel)}
function check(){const win=places.every((d,i)=>d===i);book.querySelectorAll('.slot').forEach((el,i)=>{el.classList.remove('good','wrong');el.classList.add(places[i]===i?'good':'wrong')});$('#feedback').textContent=win?'Верно! После воскресенья — снова понедельник!':'Попробуй ещё: выделенные карточки можно переставить.';}
function showGallery(){$('#reader').hidden=true;$('#gallery').hidden=false;$('#grid').innerHTML=files.map((f,i)=>f?`<button class="thumb" data-index="${i}"><img src="assets/${f}.webp" alt="${labels[i]}" loading="lazy"><span>${i+1}. ${labels[i]}</span></button>`:'').join('');$('#grid').querySelectorAll('.thumb').forEach(b=>b.onclick=()=>openImage(Number(b.dataset.index)));$('#gallery-toggle').textContent='К книге'}function hideGallery(){$('#gallery').hidden=true;$('#reader').hidden=false;$('#gallery-toggle').textContent='Все картинки'}$('#gallery-toggle').onclick=()=>$('#gallery').hidden?showGallery():hideGallery();$('#close-gallery').onclick=hideGallery;render();
</script></body></html>
